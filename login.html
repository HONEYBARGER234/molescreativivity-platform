<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Molescreativivity</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <a href="index.html" class="logo">Molescreativivity</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Create Account</a>
    </nav>
</header>

<main class="auth-page">

    <div class="auth-container">

        <h1>Welcome Back</h1>
        <p>Login to your Molescreativivity account.</p>

        <form onsubmit="loginDemo(event)">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Your password"
                    required
                >
            </div>

            <div class="login-options">

                <label class="checkbox">
                    <input
                        type="checkbox"
                        id="remember"
                    >
                    <span>Remember me</span>
                </label>

                <a href="#">Forgot password?</a>

            </div>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

    </div>

</main>

<footer>
    <p>© 2026 Molescreativivity. All rights reserved.</p>
</footer>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Main JavaScript -->
<script src="js/script.js"></script>

</body>
</html>
