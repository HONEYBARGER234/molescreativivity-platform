<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Molescreativivity</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <a href="index.html" class="logo">Molescreativivity</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="auth-page">

    <div class="auth-container">

        <h1>Create Account</h1>
        <p>Join the Molescreativivity platform.</p>

        <form onsubmit="registerDemo(event)">

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        placeholder="First name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        placeholder="Last name"
                        required
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    minlength="6"
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                    minlength="6"
                >
            </div>

            <label class="checkbox">
                <input
                    type="checkbox"
                    id="terms"
                    required
                >
                <span>I agree to the terms and conditions.</span>
            </label>

            <button type="submit" class="btn">
                Create Account
            </button>

        </form>

        <p class="auth-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</main>

<footer>
    <p>© 2026 Molescreativivity. All rights reserved.</p>
</footer>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Main JavaScript -->
<script src="js/script.js"></script>

</body>
</html>
